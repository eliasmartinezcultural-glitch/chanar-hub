<style>
body{min-height:100vh}.share-page{max-width:760px;margin:auto;padding:clamp(14px,4vw,30px)}.share-card{overflow:hidden;border:2px solid var(--ch-borde);border-radius:26px;background:var(--ch-papel);box-shadow:0 8px 0 rgba(123,87,56,.12)}.share-photo{height:min(48vw,360px);min-height:220px;background:linear-gradient(180deg,rgba(20,50,35,.05),rgba(20,50,35,.78)),url('https://upload.wikimedia.org/wikipedia/commons/b/bf/San_Patricio_del_Cha%C3%B1ar.png') center/cover;display:flex;align-items:end;padding:22px;color:#fff}.share-photo h1{font-size:clamp(2.6rem,11vw,5rem);line-height:.82;letter-spacing:-.07em;margin:0;text-shadow:0 3px 15px #0008}.share-body{padding:22px}.eyebrow{color:#7b5738;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.share-body h2{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.05;margin:7px 0}.share-body p{color:var(--ch-suave);font-size:18px}.share-actions{display:grid;gap:9px;margin-top:18px}.share-actions button,.share-actions a{min-height:56px;width:100%;font:inherit;font-weight:900;border:2px solid var(--ch-hoja);border-radius:14px;background:#fffaf0;color:var(--ch-tinta);text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:12px}.share-actions .primary{background:var(--ch-hoja);color:#fff}.share-actions .whatsapp{border-color:#438b57;background:#eef8ef}.status{min-height:24px;text-align:center;margin-top:11px;font-size:14px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.mini div{padding:11px;border:1px solid var(--ch-borde);border-radius:12px;text-align:center;font-size:13px;color:var(--ch-suave)}.mini b{display:block;color:var(--ch-tinta);font-size:18px}.credit{text-align:center;color:var(--ch-suave);font-size:13px;margin:18px 0}.credit b{color:var(--ch-tierra)}@media(max-width:560px){.share-page{padding:8px}.share-photo{min-height:230px;padding:18px}.share-body{padding:18px}.mini{grid-template-columns:1fr}.share-actions button,.share-actions a{min-height:58px}}
</style>

<body><main class="share-page"><section class="share-card"><div class="share-photo"><h1>CHAÑAR<br><span>HUB</span></h1></div><div class="share-body"><div class="eyebrow">San Patricio del Chañar · Neuquén</div><h2>Una puerta digital al Chañar.</h2><p>Guía local, mapa, lugares, servicios y territorio. Pensado para abrir desde el celular y resolver rápido.</p><div class="share-actions"><a class="primary" href="index.html">🌿 Entrar a Chañar HUB</a><button class="whatsapp" id="wa">💬 Compartir por WhatsApp</button><button id="native">↗ Compartir desde mi teléfono</button><button id="copy">🔗 Copiar enlace</button></div><div class="status" id="status" aria-live="polite"></div><div class="mini"><div><b>🔎</b>Buscar</div><div><b>🗺️</b>Explorar</div><div><b>📍</b>Resolver</div></div></div></section><p class="credit">Creado por <b>Ocarina Producciones · Elías Martínez</b></p></main>
<script>
const url='https://eliasmartinezcultural-glitch.github.io/chanar-hub/';
const text='Chañar HUB · Guía local, mapa y territorio de San Patricio del Chañar. Entrá: '+url;
const status=document.getElementById('status');
function say(t){status.textContent=t;setTimeout(()=>status.textContent='',2800)}
document.getElementById('wa').onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(text);
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);say('Enlace copiado.');}catch(e){say(url)}};
document.getElementById('native').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Chañar HUB',text:'Guía local, mapa y territorio de San Patricio del Chañar.',url});}catch(e){}}else{try{await navigator.clipboard.writeText(url);say('Tu teléfono no ofrece compartir directo. Enlace copiado.')}catch(e){say(url)}}};
</script></body></html>
