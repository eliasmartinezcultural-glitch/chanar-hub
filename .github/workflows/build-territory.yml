name: Chañar HUB · Construir territorio canónico

on:
  push:
    paths:
      - 'tools/build-territory.mjs'
      - '.github/workflows/build-territory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-territory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Consultar geoservicio provincial
        run: node tools/build-territory.mjs

      - name: Validar salida
        run: |
          test -s geo-territory.js
          node --check geo-territory.js

      - name: Publicar territorio canónico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo-territory.js
          if git diff --cached --quiet; then
            echo "Sin cambios en territorio."
          else
            git commit -m "chore: actualizar geometrías territoriales oficiales"
            git push
          fi
