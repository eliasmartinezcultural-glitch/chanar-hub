name: Chañar HUB · fuentes vivas

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Actualizar noticias locales desde RSS
        run: node scripts/update-live.mjs
      - name: Publicar cambios
        run: |
          git config user.name "chanar-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-news.json
          git diff --cached --quiet || git commit -m "chore: actualizar fuentes vivas"
          git diff --cached --quiet || git push
