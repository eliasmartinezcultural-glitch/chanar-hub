name: Chañar HUB · Importación geográfica controlada

on:
  push:
    paths:
      - 'tools/geo-importer.mjs'
      - 'geo-import-config.json'
      - '.github/workflows/geo-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-geo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar importador
        run: node tools/geo-importer.mjs

      - name: Guardar cola y reporte en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo-import-queue.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola."
          else
            git commit -m "chore: actualizar cola geográfica provincial"
            git push
          fi
