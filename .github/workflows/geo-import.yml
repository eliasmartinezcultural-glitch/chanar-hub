name: Chañar HUB · Importación geográfica controlada

on:
  push:
    paths:
      - 'tools/geo-importer.mjs'
      - 'geo-import-config.json'
      - '.github/workflows/geo-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-geo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ejecutar importador provincial
        run: node tools/geo-importer.mjs

      - name: Validar que la cola existe
        run: |
          test -s geo-import-queue.json
          node -e "const x=require('./geo-import-queue.json'); console.log(JSON.stringify(x.counts)); console.log(JSON.stringify(x.layers,null,2));"

      - name: Publicar cola como artefacto de auditoría
        uses: actions/upload-artifact@v4
        with:
          name: geo-import-queue-${{ github.run_number }}
          path: geo-import-queue.json
          retention-days: 7

      - name: Guardar cola en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo-import-queue.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola."
          else
            git commit -m "chore: actualizar cola geográfica provincial"
            git push
          fi
