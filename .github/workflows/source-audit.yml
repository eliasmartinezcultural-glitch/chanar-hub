name: Chañar HUB · Auditoría de fuentes

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Comprobar fuentes
        run: node scripts/source-audit.mjs

      - name: Guardar reporte de auditoría
        run: |
          git config user.name 'chanar-hub-auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add data/source-audit-latest.json
          git diff --cached --quiet || git commit -m 'chore: actualizar auditoria automatica de fuentes'
          git push
